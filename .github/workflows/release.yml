name: release

# A tag, or a dry run. The dry run is not a convenience: a tag-triggered pipeline cannot be
# debugged by pushing tags, because every attempt either burns a version number or forces a
# force-push over a tag. This builds, bundles and packages, and stops before anything is submitted
# to Apple or published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package, but do not notarize or publish
        type: boolean
        default: true

permissions:
  contents: write        # gh release create. Nothing else.

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run that may be mid-submission: a cancelled notarytool leaves a submission
  # Apple is still processing and this job no longer watching.
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # scripts/version.sh --check-bump reads the previous tag

      # The same toolchain ci.yml gates the code with. Deliberately not a newer one: AppKit and
      # SwiftUI key a great deal of behaviour off the SDK an app was *linked* against, so building
      # the shipped artifact on a newer SDK would hand users a binary whose runtime behaviour was
      # never the one tested — and would bypass the one gate CLAUDE.md says this project relies on.
      - name: Pin Xcode to the macOS 14 SDK
        run: ./scripts/pin-xcode.sh --select

      - name: The tag and the version agree
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/version.sh --expect "${GITHUB_REF_NAME}"

      - name: The build number went up
        run: ./scripts/version.sh --check-bump

      # Before anything is signed or submitted. A failed l10n-check after a notarization
      # submission is a wasted round trip and a burned tag.
      - name: Structural invariants
        run: ./scripts/invariants.sh

      - name: Translations complete
        run: ./scripts/l10n-check.sh

      - name: No device identifiers committed
        run: ./scripts/id-check.sh

      # set-key-partition-list is the line people leave out, and without it codesign blocks
      # forever on an invisible "allow access to key" prompt until the job times out. Nothing here
      # uses sudo: importing into a keychain this job created is a per-user operation, which is
      # the same rule the product itself follows.
      - name: Import the Developer ID certificate
        if: env.DRY_RUN != 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          KC_PW="$(uuidgen)"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" \
                          -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning | grep -c "Developer ID Application"

      - name: Assemble and sign (release)
        if: env.DRY_RUN != 'true'
        env:
          # Optional. Left unset, scripts/signing-identity.sh finds the one Developer ID
          # Application certificate in the keychain this job just made, and fails if there is
          # more than one — which on a fresh runner keychain there cannot be.
          MICPEG_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: MICPEG_RELEASE=1 ./scripts/bundle.sh

      - name: Assemble (dry run, ad-hoc signature)
        if: env.DRY_RUN == 'true'
        run: MICPEG_ADHOC=1 ./scripts/bundle.sh

      # The app gets its own ticket, so it launches on a Mac with no network once it is dragged
      # out of the image. scripts/notarize.sh says why both artifacts are submitted.
      - name: Notarize and staple the app
        if: env.DRY_RUN != 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # Through the environment rather than interpolated into the script: a secret expanded
          # into a `run` block becomes part of the shell text, which is the shape every
          # script-injection advisory is about, and base64 so that a stripped trailing newline
          # cannot corrupt the PEM.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/key.p8" >> "$GITHUB_ENV"
          APPLE_API_KEY="$RUNNER_TEMP/key.p8" ./scripts/notarize.sh build/Micpeg.app

      - name: Package the disk image
        env:
          MICPEG_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MICPEG_DMG_UNSIGNED: ${{ env.DRY_RUN == 'true' && '1' || '' }}
        run: ./scripts/dmg.sh

      - name: Notarize and staple the disk image
        if: env.DRY_RUN != 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/notarize.sh "build/Micpeg-$(./scripts/version.sh --short).dmg"

      # Always, so a dry run leaves something to look at.
      - uses: actions/upload-artifact@v4
        with:
          name: Micpeg-${{ github.ref_name }}
          path: |
            build/Micpeg-*.dmg
            build/Micpeg-*.dmg.sha256

      - name: Publish the release
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
             build/Micpeg-*.dmg build/Micpeg-*.dmg.sha256 \
             --generate-notes --verify-tag

      # Paste-ready rather than auto-committed. The cask is a single file in a tap nobody else
      # reviews, and automating it before it has been done by hand twice is how a release ships a
      # cask pointing at a sha256 nobody read. The digest cannot be predicted: hdiutil embeds
      # timestamps, so two builds of identical source differ.
      - name: The cask stanza for the tap
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(./scripts/version.sh --short)
          SHA=$(awk '{print $1}' build/Micpeg-$V.dmg.sha256)
          {
            echo '### Casks/micpeg.rb'
            echo '```ruby'
            echo "  version \"$V\""
            echo "  sha256 \"$SHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the temporary keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/key.p8"
