name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Check deployment target
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/micpin"
          lipo -info "$BIN"
          otool -l "$BIN" | grep -A3 LC_BUILD_VERSION

      # The repo must never carry device identifiers. This is the enforcement.
      - name: No device identifiers committed
        run: |
          if git grep -nIE '[0-9A-F]{2}(-[0-9A-F]{2}){5}:(input|output)' -- . ; then
            echo "::error::a Bluetooth MAC-based device UID is committed"; exit 1
          fi
          if git ls-files | grep -q 'leakcheck-result'; then
            echo "::error::soak-test output is committed; it contains local device names"; exit 1
          fi
