name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Selecting the toolchain is a script, not inline YAML: release.yml must pin the *same*
      # SDK, and two inline copies drift. scripts/pin-xcode.sh says why the pin exists and
      # asserts the SDK it actually landed on.
      - name: Pin Xcode to the macOS 14 SDK
        run: ./scripts/pin-xcode.sh --select

      - name: Build (release)
        run: swift build -c release

      - name: Build (universal)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Check deployment target
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/micpeg"
          lipo -info "$BIN"
          otool -l "$BIN" | grep -A3 LC_BUILD_VERSION

      # The invariants in CLAUDE.md, enforced rather than trusted. The script prints the
      # directories it actually searched, so a check cannot pass by looking at nothing.
      - name: Structural invariants
        run: ./scripts/invariants.sh

      # Every string the app localizes has a Korean translation. The keys come from the
      # compiler, not from a pattern over the source, and the script prints what it read.
      - name: Translations complete
        run: ./scripts/l10n-check.sh

      # The repo must never carry device identifiers. A script rather than an inline grep, so a
      # contributor can run the same check before pushing — see CONTRIBUTING.md.
      - name: No device identifiers committed
        run: ./scripts/id-check.sh

      # Assembling the bundle checks five things nothing else does: the MacOS directory holds two
      # files that differ by more than case, BundleProgram resolves to an executable inside the
      # bundle, every .strings table parses, Info.plist's CFBundleLocalizations and the .lproj
      # directories agree, and the icon exists and is the size it claims. All five used to be
      # "the maintainer ran bundle.sh locally". An ad-hoc signature still carries the hardened
      # runtime and the entitlements, so the entitlement split is asserted here too.
      - name: Assemble the bundle (ad-hoc signature)
        run: MICPEG_ADHOC=1 ./scripts/bundle.sh
